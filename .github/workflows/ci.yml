name: Test
on:
  pull_request:
  push:
    branches: [master, develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            nondoc:
              - '!**/*.rst'
      - run: echo 'changed=${{ steps.changes.outputs.nondoc }}' >> "$GITHUB_OUTPUT"
        id: changed
    outputs:
      changed: ${{ steps.changed.outputs.changed }}

  build-test:
    needs: check-paths
    if: needs.check-paths.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8 is EOL. Also adapt tox.ini
        python-version: ['3.8', 'pypy3.11', '3.x']
        # macOS on ARM, Ubuntu on x86, Windows on X86
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable .[dev]
      - name: Test with tox
        run: tox -e py

  pass:
    needs: build-test
    if: |
      needs.build-test.result == 'success' && needs.build-test.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Curiosity
        run: |
          echo "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
